name: Run tests
on:
  workflow_call

jobs:
  run_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10' 
      - name: Install pip
        run: python -m ensurepip --upgrade
      - name: Install pip tools
        # Pinned: pip-tools 7.6.0 (2026-07-18) imports typing_extensions in
        # piptools/writer.py without declaring it as a dependency, so a clean
        # py3.10 env crashes on `pip-compile`. Revisit once upstream ships a
        # release that declares (or drops) the typing_extensions import.
        run: pip install pip-tools==7.5.3
      - name: Install compile dependencies
        run: pip-compile --output-file=requirements.txt requirements-base.in requirements-dev.in requirements.in
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt
      - name: Run unit tests
        run: pytest
